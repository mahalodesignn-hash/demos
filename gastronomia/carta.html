<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta</title>
  <link rel="stylesheet" href="../comun/estilos.css?v=20261002b">

  <script src="tema.js?v=20261002b"></script>

  </div>

  <div class="hoja-fondo oculto" id="hoja-fondo"><div class="hoja" id="hoja"></div></div>
