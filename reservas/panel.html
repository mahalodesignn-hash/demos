<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de turnos</title>
  <link rel="stylesheet" href="../comun/estilos.css?v=20260928b">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor">
      <h1 id="negocio-nombre"></h1>
      <p>Panel de turnos</p>
    </div>
  </header>

  <main class="contenedor">
    <section class="metricas" id="metricas"></section>

    <div class="barra">
      <div class="pestanas">
        <button class="pestana activa" data-vista="agenda">Agenda</button>
        <button class="pestana" data-vista="espera">Lista de espera <span id="cuenta-espera"></span></button>
      </div>
      <div class="acciones">
        <a class="boton secundario chico" href="index.html" target="_blank">Abrir página de reservas</a>
        <button class="boton secundario chico" id="btn-reiniciar">Reiniciar demo</button>
      </div>
    </div>

    <section class="tarjeta" id="vista-agenda">
      <div class="barra" style="margin-bottom:4px">
        <div class="navegar-dia">
          <button class="boton secundario chico" id="dia-anterior" aria-label="Día anterior">◀</button>
          <strong id="dia-actual"></strong>
          <button class="boton secundario chico" id="dia-siguiente" aria-label="Día siguiente">▶</button>
        </div>
        <button class="boton secundario chico" id="dia-hoy">Hoy</button>
      </div>
      <div id="lista-turnos"></div>
    </section>

    <section class="tarjeta oculto" id="vista-espera">
      <h2>Lista de espera</h2>
      <p class="vacio" style="margin-top:0">Cuando cancelás un turno, el sistema te sugiere a quién ofrecerle el lugar.</p>
      <div id="lista-espera"></div>
    </section>
  </main>

  <div class="fondo-modal oculto" id="modal">
    <div class="modal" id="modal-contenido"></div>
  </div>

  <footer class="pie">Demo · los datos se guardan solo en este navegador</footer>

  <script src="config.js?v=20260928b"></script>
  <script src="datos.js?v=20260928b"></script>
  <script src="panel.js?v=20260928b"></script>
</body>
</html>
